stages:
  - resume
  - mirror

resume-pdf:
  stage: resume
  image:
    name: pandoc/latex:latest
    entrypoint: [""]
  rules:
    - if: $CI_SERVER_HOST == "gitlab.com" && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  before_script:
    - apk add --no-cache git
    - git config --global user.name "James Pryor"
    - git config --global user.email "james@geekwagon.net"
  script:
    # Generate the PDF
    - pandoc resume_pryor.md -o resume_pryor.pdf

    # Commit and push only if the PDF changed
    - git add resume_pryor.pdf
    - |
      if ! git diff --cached --quiet; then
        git commit -m "Regenerate PDF resume"
        git push "https://gitlab-ci-token:${CI_JOB_TOKEN}@${CI_SERVER_HOST}/${CI_PROJECT_PATH}.git" "HEAD:${CI_DEFAULT_BRANCH}"
      else
        echo "Resume PDF unchanged; skipping commit."
      fi

mirror_to_forges:
  stage: mirror
  image: alpine:latest
  rules:
    - if: $CI_SERVER_HOST == "gitlab.com" && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  before_script:
    - apk add --no-cache git
    - git config --global user.name "James Pryor"
    - git config --global user.email "james@geekwagon.net"
  script:
    - cd "$CI_PROJECT_DIR"

    # Fetch the latest commit to include the generated resume
    - git fetch origin "$CI_DEFAULT_BRANCH"
    - git reset --hard FETCH_HEAD

    # Codeberg push
    - git remote add codeberg https://${CODEBERG_TOKEN}@codeberg.org/deplicator/.profile.git
    - git push --force codeberg HEAD:main

    # Gitea.com push
    - git remote add gitea https://${GITEA_TOKEN}@gitea.com/deplicator/.profile.git
    - git push --force gitea HEAD:main

    # GitHub push
    - git remote add github https://x-access-token:${GITHUB_TOKEN}@github.com/deplicator/deplicator.git
    - git push --force github HEAD:main
